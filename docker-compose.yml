services:
  mysql:
    image: mysql:8.4
    container_name: devlog-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: devlog
      MYSQL_DATABASE: devlog
      MYSQL_USER: devlog
      MYSQL_PASSWORD: devlog
    volumes:
      - devlog-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  devlog-mysql-data: